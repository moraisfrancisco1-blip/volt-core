services:
  api:
    build:
      context: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+psycopg://volt:volt_dev@db:5432/volt_core
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volt_core
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: volt_dev
    ports:
      - "5432:5432"
    volumes:
      - volt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt -d volt_core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  volt_postgres_data:
